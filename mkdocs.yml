site_name: CVOR Anesthesia Reference
site_url: https://dzauski585.github.io
site_author: dz
site_description: Cardiac anesthesia reference for CRNA students

docs_dir: docs
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  custom_dir: overrides

  palette:
    # Light mode
    - scheme: default
      primary: blue-grey
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: black
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.tabs             # top-level section tabs in header
    - navigation.tabs.sticky      # tabs stay visible on scroll
    - navigation.sections         # section headers rendered in sidebar
    - navigation.top              # back-to-top button
    - navigation.indexes          # section folders can have index pages
    - navigation.path             # breadcrumbs above the page title
    - navigation.footer           # previous/next links at the bottom of each page
    - toc.follow                  # on-page contents scrolls with the reader
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy

  icon:
    repo: fontawesome/brands/github

repo_url: https://github.com/dzauski585/dzauski585.github.io
repo_name: dzauski585/dzauski585.github.io

plugins:
  - search
  - glightbox           # click-to-zoom all images — critical for TEE/echo images
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details    # enables ??? collapsible blocks
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3      # hides H4s from the on-page contents

extra:
  comments: true
  analytics:
    provider: custom

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

copyright: >
  Built by dz
  Content for educational use only. Not a substitute for clinical judgment.

# Files stay in their current folders, so existing URLs keep working.
nav:
  - Home: index.md
  - CVOR:
    - cvor/index.md
    - The Case:
      - Case Guide: cvor/cv_or_guide.md
      - Structural Heart & EP: cvor/structural_heart.md
    - Skills:
      - Intraoperative TEE: cvor/TEE.md
      - Using an Ultrasound: cvor/ultrasound.md
    - Physiology & Pharmacology:
      - Cardiac Physiology: cvor/cardiac_physiology.md
      - CV Pharmacology: cvor/CVPharm.md
      - Vasoplegia: cvor/vasoplegia.md
      - IV Methadone: cvor/methadone.md
    - Go Further:
      - CV Test: assessment.html
      - Mechanical Support: cvor/Mechanical_Support.md
      - TEG: cvor/TEG.md
      - Papers by Our Team: cvor/papers.md
  - Reference:
    - reference/index.md
    - Case Notes:
      - cases/index.md
      - Thoracic Anesthesia: cases/thoracic_review.md
      - OB Anesthesia: cases/ob_review.md
      - TIVA & TCI: cases/TIVA.md
    - Complications:
      - complications/index.md
      - Cardiac Arrest in OR: complications/cardiac_arrest_OR.md
      - Stanford Emergency Manual: boards/Stanford_Emergency_Manual.md
      - Case Complications: complications/complications.md
      - Thyroid Surgery: complications/Thyroid_Complications.md
      - Hyperperfusion Syndrome: complications/hyperperfusion.md
      - Corneal Abrasion: complications/corneal_abrasion.md
    - Antibiotics:
      - Antibiotic Guide: boards/antibiotic_guide.md
      - Stanford Periop Antibiotics: boards/stanford_perioperative_abx_guide.md
      - Cephalosporin Cross-Reactivity: boards/Cephalosporin_Cross.md
    - Perioperative Tools:
      - Goal-Directed Fluids: boards/goal_directed_fluid_therapy.md
      - Gastric Ultrasound: boards/gastric_US.md
    - Boards Review:
      - boards/index.md
      - Anatomy & Physiology: boards/Anatomy_physiology.md
      - Pharmacology Review: boards/pharmacology_review.md
      - Monitors Review: boards/monitor_review.md
      - Math & Physics: boards/math_physics_review.md
  - About: about.md
